name: Bug report
description: Something behaves differently from what the README says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens, or real document contents (invoices,
        contracts, personal data). Sanitise the sample down to what
        reproduces the problem.

        Found a security hole instead? Do not use this form — see SECURITY.md.
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.10 or 3.12 (CI's tested versions)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu 22.04 / macOS 14"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Include flags, e.g. `python extract.py --doc invoice.pdf --schema schema.yaml --provider anthropic`
      render: console
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input data
      description: >-
        The schema you used, and a trimmed/sanitised sample of the document.
        No real invoice, contract, or personal data — replace values with
        placeholders that keep the same shape.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
