# Describe the fields you want pulled out of each document.
# type is one of: string | number | array
fields:
  - name: invoice_number
    type: string
    description: The invoice identifier / number
  - name: date
    type: string
    description: Invoice date, ISO format if possible
  - name: vendor
    type: string
    description: Company that issued the invoice
  - name: total
    type: number
    description: Grand total amount
  - name: line_items
    type: array
    description: List of purchased items with description and amount
